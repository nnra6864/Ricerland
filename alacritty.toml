[general]
live_config_reload = true

[window]
padding = {x = 10, y = 10}
opacity = 1

[font]
normal = { family = "Maple Mono NF CN", style = "Regular" }
bold = { family = "Maple Mono NF CN", style = "Bold" }
italic = { family = "Maple Mono NF CN", style = "Italic" }
bold_italic = { family = "Maple Mono NF CN", style = "Bold Italic" }
size = 11

[colors]
footer_bar = { foreground = "#ACCAE6", background = "#102840" }
transparent_background_colors = true

[colors.primary]
foreground = "#ACCAE6"
background = "#102840"
dim_foreground = "#8EA7BF"
bright_foreground = "#BDDFFF"

[colors.search]
matches = { foreground = "#ACCAE6", background = "#102840" }
focused_match = { foreground = "#BDDFFF", background = "#102840" }

[colors.hints]
start = { foreground = "#ACCAE6", background = "#102840" }
end = { foreground = "#8EA7BF", background = "#102840" }

[colors.normal]
black = "#102840"
red = "#BF3030"
green = "#60BF30"
yellow = "#BFA730"
blue = "#3078BF"
magenta = "#8330BF"
cyan = "#608FBF"
white = "#ACCAE6"

[colors.bright]
black = "#153959"
red = "#D83636"
green = "#6DD836"
yellow = "#D8BB36"
blue = "#3687D8"
magenta = "#9336D8"
cyan = "#6DA1D8"
white = "#BDDFFF"

[cursor]
style = { shape = "Beam", blinking = "Off" }
vi_mode_style = { shape = "Block", blinking = "Off" }

#alacritty-smooth-cursor settings
#smooth_motion = true
#smooth_motion_factor = 0.2
#smooth_motion_spring = 0.5
