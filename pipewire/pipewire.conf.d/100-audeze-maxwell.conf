monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.usb-Audeze_LLC_Audeze_Maxwell_Headset_.*"
      }
    ]
    actions = {
      audio.format = "S24LE"
      audio.rate = 96000
      audio.channels = 2
      node.pause-on-idle = false
      session.suspend-timeout-seconds = 0
    }
  }
]
