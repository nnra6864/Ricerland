# MainMod
$mainMod = SUPER

# Apps
$terminal = ghostty
$browser = zen-browser
$textEditor = nvim
$fileManager = yazi

# Window
$activeOpacity = 1.0
$inactiveOpacity = 1.0
$rounding = 10
$roundingPower = 2
$borderSize = 2
$borderRotation = 90deg
$borderFadeAnimation = 1
$borderFadeDuration = 1
$borderFadeBezier = quadOut
$borderRotationAnimation = 1
$borderRotationDuration = 30
$borderRotationBezier = linear
$borderRotationType = loop
$borderActiveCol = rgba(266F7FFF) rgba(A3C5CCFF) $borderRotation
$borderInactiveCol = rgba(1E444CFF) rgba(899699FF) $borderRotation
$gapsIn = 5
$gapsOut = 10
$blur = true
$blurSize = 20
$blurPasses = 4
$shadowCol = rgba(081D2680)
$shadowInactiveCol = rgba(081D2680)

# Font
$font = Maple Mono NF CN
$fontSize = 13

# Theme
$theme = oomox-Ricer
$background = ~/.config/Backgrounds/Kyanos/Misty_Cloudy_Mountain.jpg
$bgCol = 081D26
$fgCol = A3C5CC
$bgColA = 081D2680
$termColors = LS_COLORS,di=#A3C5CC:fi=#A3C5CC:ln=#267F6F:pi=#267F6F:so=#266F7F:bd=#266F7F:cd=#266F7F:or=#7F2626:mi=#7F2626:ex=#267F32

# Cursor
$cursor = Bibata-Modern-Ice
$cursorSize = 24
$cursorRot = 21

# Animation
$animationDuration = 2
$animationCurve = expoOut
bezier = myBezier, 0.05, 0.9, 0.1, 1.05
bezier = linear, 0.0, 0.0, 1.0, 1.0
bezier = quad, 0.45, 0, 0.55, 1
bezier = quadOut, 0.5, 1, 0.89, 1
bezier = expo, 0.87, 0, 0.13, 1
bezier = expoIn, 0.7, 0, 0.84, 0
bezier = expoOut, 0.16, 1, 0.3, 1
bezier = overshoot, 0.25, 1.75, 0, 0.9

# Group
$groupBorder = rgba(266F7FFF) rgba(A3C5CCFF) 90deg
$groupBorderInactive = rgba(1A4E59FF) rgba(849FA5FF) 270deg
$groupBorderLocked = rgba(66661FFF)
$groupBorderLockedInactive = rgba(1A4E59FF)


# Source Configs
source = ~/.config/hypr/env.conf
source = ~/.config/hypr/render.conf
source = ~/.config/hypr/cursor.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/rules.conf
source = ~/.config/hypr/HyprlandUnityFix/UnityFix.conf
source = ~/.config/hypr/layout.conf
source = ~/.config/hypr/dwindle.conf
source = ~/.config/hypr/master.conf
source = ~/.config/hypr/scrolling.conf
source = ~/.config/hypr/general.conf
source = ~/.config/hypr/binds.conf
source = ~/.config/hypr/ecosystem.conf
source = ~/.config/hypr/decoration.conf
source = ~/.config/hypr/misc.conf
source = ~/.config/hypr/animations.conf
source = ~/.config/hypr/group.conf
source = ~/.config/hypr/startup.conf
source = ~/.config/hypr/plugins.conf
exec-once = sleep 5

# This is needed for shaders using time, delete this line to potentially improve performance
#debug:damage_tracking = off
