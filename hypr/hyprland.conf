#hyprlang noerror true
experimental:xx_color_management_v4 = true
experimental:wide_color_gamut = true
#hyprlang noerror false

debug:damage_tracking = off #This is needed for shaders using time, delete this line to potentially improve performance
$mainMod = SUPER
$terminal = kitty
$browser = firefox
$text_editor = nvim
$file_manager = dolphin
$windowOpacity = 0.85
$cursor = Bibata-Modern-Ice
$cursor_size = 32
$cursor_rot = 21
$font = Courier Prime Code
$font_size = 15
$background = ~/.config/Backgrounds/Nord/NordicRuinsInASnowyBlizzard.jpg
$bg_col = 102840
$fg_col = ACCAE6
$term_colors = LS_COLORS,di=#BDDFFF:fi=#ACCAE6:ln=#6699CC:pi=#275E99:so=#275E99:bd=#275E99:cd=#275E99:or=#174066:mi=#174066:ex=#1F4F7F

monitor = , 5120x1440@240, auto, auto
monitor = HDMI-A-2, disable
#monitor = , 2560x1440@120, 0x0, auto
#monitor = HDMI-A-2, 2560x1440@120, 2560x0, auto

exec-once = hyprpm reload -n
source = ~/.config/hypr/plugins.conf
exec-once = sleep 5

source = ~/.config/hypr/env.conf
source = ~/.config/hypr/rules.conf
source = ~/.config/hypr/UnityFix.conf
source = ~/.config/hypr/binds.conf
source = ~/.config/hypr/startup.conf

input {
    kb_layout = us
    kb_variant = 
    kb_model =
    kb_options =
    kb_rules =
    repeat_delay = 400
    numlock_by_default = true

    follow_mouse = 1

    #scroll_method = on_button_down
    scroll_factor = 0.5
    
    touchpad {
	natural_scroll = false
    }

    sensitivity = 0
    accel_profile = flat
}

general {
    border_size = 2
    col.active_border = rgba(6699CCFF) rgba(BDDFFFFF) 90deg
    col.inactive_border = rgba(26394CFF) rgba(5E6E7FFF) 270deg
    layout = dwindle
    resize_on_border = true
    gaps_in = 5
    gaps_out = 10
	
	snap {
		enabled = true
		window_gap = 25
		monitor_gap = 25
	}
}

decoration {
    rounding = 10
    inactive_opacity = 0.9
    blur {
        size = 10
		passes = 3
		ignore_opacity = true
		noise = 0.02
		contrast = 1
		vibrancy = 1
		popups = true
		new_optimizations = false #Fixes hyprwinwrap not being visible behind tiled windows
    }

	shadow {
		enabled = true
		range = 10
		render_power = 2
		color = rgba(102840FF)
		color_inactive = rgba(061019FF)
	}
}

group {
    col.border_active = rgba(6699CCFF) rgba(BDDFFFFF) 90deg
    col.border_inactive = rgba(26394CFF) rgba(5E6E7FFF) 270deg
    col.border_locked_active = rgba(205080FF)
    col.border_locked_inactive = rgba(26394CFF)

    groupbar {
	enabled = false
    }
}

misc {
    middle_click_paste = false
    disable_hyprland_logo = true
    disable_splash_rendering = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    background_color = rgba(102840FF)
    font_family = $font
	splash_font_family = $font
	close_special_on_empty = false
}

animations {
    enabled = true
	$duration = 4
	$curve = overshoot

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = linear, 0.0, 0.0, 1.0, 1.0
    bezier = quad, 0.45, 0, 0.55, 1
    bezier = quadOut, 0.5, 1, 0.89, 1
    bezier = expo, 0.87, 0, 0.13, 1
    bezier = expoIn, 0.7, 0, 0.84, 0
    bezier = expoOut, 0.16, 1, 0.3, 1
	bezier = overshoot, 0.25, 1.75, 0, 0.9

	animation = fade, 1, $duration, expoOut

    animation = windows, 1, $duration, $curve, slide
    animation = windowsOut, 1, $duration, $curve, slide
    animation = windowsMove, 1, $duration, $curve

	animation = layersIn, 1, $duration, $curve, fade
    animation = layersOut, 1, $duration, $curve, fade

    animation = border, 1, $duration, quadOut
    animation = borderangle, 1, 30, linear, loop

    animation = workspaces, 1, $duration, $curve, slide
    animation = specialWorkspace, 1, $duration, $curve, slidefadevert
}

dwindle {
    pseudotile = true
    preserve_split = true # you probably want this
    smart_split = true
}

gestures {
    workspace_swipe = false
}
