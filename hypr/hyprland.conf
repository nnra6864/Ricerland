# MainMod
$mainMod = SUPER

# Apps
$terminal = ghostty
$browser = zen-browser
$textEditor = nvim
$fileManager = dolphin

# Window
$activeOpacity = 1.0
$inactiveOpacity = 1.0
$rounding = 0
$roundingPower = 1
$borderSize = 2
$borderRotation = 225deg
$borderFadeAnimation = 1
$borderFadeDuration = 10
$borderFadeBezier = expoOut
$borderRotationAnimation = 0
$borderRotationDuration = 5
$borderRotationBezier = quadOut
$borderRotationType = once
$borderActiveCol = rgba(282E22FF) rgba(889180FF) $borderRotation
$borderInactiveCol = rgba(000000FF) rgba(5D5E5CFF) $borderRotation
$gapsIn = 5
$gapsOut = 10
$blur = false
$blurSize = 20
$blurPasses = 4
$shadowCol = rgba(3E4637FF)
$shadowInactiveCol = rgba(3E4637FF)

# Font
$font = Maple Mono NF CN
$fontSize = 13

# Theme
$theme = oomox-Ricer
$background = ~/.config/Backgrounds/CS_1.6_Menu.jpg
$bgCol = 4C5843
$fgCol = D8DED3
$bgColA = 4C5843FF
$termColors = LS_COLORS,di=#D8DED3:fi=#D8DED3:ln=#B8C4A9:pi=#B8C4A9:so=#DDCC59:bd=#DDCC59:cd=#DDCC59:or=#627258:mi=#627258:ex=#6E8461

# Cursor
$cursor = Bibata-Modern-Ice
$cursorSize = 24
$cursorRot = 21

# Animation
$animationDuration = 4
$animationCurve = overshoot
bezier = myBezier, 0.05, 0.9, 0.1, 1.05
bezier = linear, 0.0, 0.0, 1.0, 1.0
bezier = quad, 0.45, 0, 0.55, 1
bezier = quadOut, 0.5, 1, 0.89, 1
bezier = expo, 0.87, 0, 0.13, 1
bezier = expoIn, 0.7, 0, 0.84, 0
bezier = expoOut, 0.16, 1, 0.3, 1
bezier = overshoot, 0.25, 1.75, 0, 0.9

# Group
$groupBorder = rgba(282E22FF) rgba(889180FF) 90deg
$groupBorderInactive = rgba(060705FF) rgba(636B5DFF) 270deg
$groupBorderLocked = rgba(958831FF)
$groupBorderLockedInactive = rgba(060705FF)


# Source Configs
source = ~/.config/hypr/env.conf
source = ~/.config/hypr/render.conf
source = ~/.config/hypr/cursor.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/rules.conf
source = ~/.config/hypr/HyprlandUnityFix/UnityFix.conf
source = ~/.config/hypr/layout.conf
source = ~/.config/hypr/dwindle.conf
source = ~/.config/hypr/master.conf
source = ~/.config/hypr/scrolling.conf
source = ~/.config/hypr/general.conf
source = ~/.config/hypr/binds.conf
source = ~/.config/hypr/ecosystem.conf
source = ~/.config/hypr/decoration.conf
source = ~/.config/hypr/misc.conf
source = ~/.config/hypr/animations.conf
source = ~/.config/hypr/group.conf
source = ~/.config/hypr/startup.conf
source = ~/.config/hypr/plugins.conf
exec-once = sleep 5

# This is needed for shaders using time, delete this line to potentially improve performance
#debug:damage_tracking = off
