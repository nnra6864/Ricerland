# MainMod
$mainMod = SUPER

# Apps
$terminal = kitty
$browser = zen-browser
$textEditor = nvim
$fileManager = dolphin

# Window
$activeOpacity = 0.9
$inactiveOpacity = 0.8
$rounding = 10
$roundingPower = 4
$borderSize = 2
$borderActiveCol = rgba(B2B2B2FF) rgba(999999FF) 90deg
$borderInactiveCol = rgba(323232FF) rgba(191919FF) 90deg
$gapsIn = 5
$gapsOut = 10
$blur = true
$blurSize = 10
$blurPasses = 3
$shadowCol = rgba(080808FF)
$shadowInactiveCol = rgba(000000FF)

# Font
$font = Courier Prime Code
$fontSize = 15

# Theme
$theme = Ricer
$background = ~/.config/Backgrounds/Nord/NordicRuinsInASnowyBlizzard.jpg
$bgCol = 080808
$fgCol = B2B2B2
$bgColA = 080808FF
$termColors = LS_COLORS,di=#CBCBCB:fi=#B2B2B2:ln=#0094B2:pi=#0094B2:so=#0077B2:bd=#0077B2:cd=#0077B2:or=#B20000:mi=#B20000:ex=#00B20E

# Cursor
$cursor = Bibata-Modern-Ice
$cursorSize = 32
$cursorRot = 21

# Animation
$animationDuration = 4
$animationCurve = overshoot

# Group
$groupBorder = rgba(B2B2B2FF) rgba(999999FF) 90deg
$groupBorderInactive = rgba(323232FF) rgba(191919FF) 270deg
$groupBorderLocked = rgba(998000FF)
$groupBorderLockedInactive = rgba(323232FF)


# Source Configs
source = ~/.config/hypr/env.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/rules.conf
source = ~/.config/hypr/HyprlandUnityFix/UnityFix.conf
source = ~/.config/hypr/ResolveHyprlandFix/ResolveFix.conf
source = ~/.config/hypr/binds.conf
source = ~/.config/hypr/layout.conf
source = ~/.config/hypr/general.conf
source = ~/.config/hypr/decoration.conf
source = ~/.config/hypr/misc.conf
source = ~/.config/hypr/animations.conf
source = ~/.config/hypr/group.conf
source = ~/.config/hypr/startup.conf

# Reload hyprpm and source the plugins config
exec-once = hyprpm reload -nn
source = ~/.config/hypr/plugins.conf
exec-once = sleep 5

# This is needed for shaders using time, delete this line to potentially improve performance
#debug:damage_tracking = off
