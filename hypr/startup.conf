# Startup
# Exports env vars to services and fixes long app launch times
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP DISPLAY
exec-once = hyprlock
exec-once = sunshine

# App Tracking
exec-once = fish -c "track_app_usage"

# Settings
exec-once = systemctl --user start hyprpolkitagent
exec-once = hyprctl setcursor $cursor $cursorSize

# Clipboard
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Daemons
exec-once = pypr
exec-once = dunst
exec-once = hypridle
exec-once = syncthing
exec-once = kdeconnectd
exec-once = kdeconnect-indicator
#exec-once = ollama serve
exec-once = ydotoold # required for Hyprmouse
exec-once = sleep 3 && lan-mouse daemon
#exec-once = easyeffects --gapplication-service
exec-once = openrgb --startminimized --profile "Off" --server
exec-once = vicinae server

# Background
exec-once = hyprpaper
#exec-once = swww-daemon
#exec-once = glava #GLava
#exec-once = alacritty --option window.opacity=0.0 --class "Background" -e pipes.sh #Pipes
#exec-once = alacritty --option window.opacity=0.0 --class "Background" -e unimatrix -af -c blue -s 96 #Matrix
#exec-once = alacritty --option window.opacity=0.0 --option font.size=14 --class "Background" -e asciiquarium #ASCIIQuarium
exec-once = ~/Data/Projects/Unity/Nisualizer/Builds/Linux/Nisualizer.x86_64

# Workspace 1
exec-once = $browser

# Social Workspace
exec-once = mumble
exec-once = sleep 1 && element-desktop
exec-once = sleep 3 && Telegram
exec-once = sleep 5 && equibop # Make sure to disable Equibop Settings -> Enable Splash Screen so the main window insta opens

# Special Workspace
exec-once = keepassxc
exec-once = sleep 1 && ghostty --class=com.ghostty.ncmpcpp -e ncmpcpp
exec-once = sleep 2 && obsidian
exec-once = sleep 3 && obs --startreplaybuffer --disable-shutdown-check

# Change to exec-once if you don't need live reloading
#exec = swww img $background
#exec = export XCURSOR_THEME=$cursor
#exec = export XCURSOR_SIZE=$cursor_size
#exec = hyprctl setcursor $cursor $cursor_size
