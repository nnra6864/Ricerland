# Settings
exec-once = systemctl --user start hyprpolkitagent
exec-once = hyprctl setcursor Nordzy-cursors-white 30

# Clipboard
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Daemons
exec-once = pypr
exec-once = dunst #Not needed when using AGS
exec-once = syncthing
exec-once = kdeconnectd
exec-once = ydotoold # required for Hyprmouse

#Background
#exec-once = swww-daemon
#exec-once = glava #GLava
#exec-once = alacritty --option window.opacity=0.0 --class "Background" -e pipes.sh #Pipes
#exec-once = alacritty --option window.opacity=0.0 --class "Background" -e unimatrix -af -c blue -s 96 #Matrix
#exec-once = alacritty --option window.opacity=0.0 --option font.size=14 --class "Background" -e asciiquarium #ASCIIQuarium
#exec-once = output_input
exec-once = /home/nnra/Data/Projects/Unity/Nisualizer/Builds/Linux/Nisualizer.x86_64

#Apps
#exec-once = alacritty --class "Ncmpcpp" -e ncmpcpp
exec-once = keepassxc
exec-once = kitty --class Ncmpcpp -e ncmpcpp
exec-once = openrgb --startminimized --profile "Off" --server
exec-once = $browser
exec-once = vesktop
exec-once = telegram
exec-once = obsidian

#Change to exec-once if you don't need live reloading
exec = swww img $background
exec = export XCURSOR_THEME=$cursor
exec = export XCURSOR_SIZE=$cursor_size
exec = hyprctl setcursor $cursor $cursor_size
