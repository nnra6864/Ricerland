# Setting this any higher causes weird behaviour
binds:scroll_event_delay = 1

# Hypr
bind = $mainMod SHIFT, P, exit
bind = $mainMod CTRL, P, exec, xdph && notify-send "XDPH" "Restartarted Hyprland Portal"

# Window Management
bind = $mainMod, F, fullscreen
bind = $mainMod CTRL, F, fullscreenstate, 0, 3 # Fake fullscreen
bind = $mainMod ALT, F, fullscreenstate, 1 # Maximize
bind = $mainMod, V, togglefloating
bind = $mainMod, C, killactive
bind = $mainMod, C, exec, paplay ~/.config/SFX/Select.wav
bind = $mainMod, mouse:274, killactive
bind = $mainMod, X, centerwindow
bind = $mainMod, Z, pseudo
bind = $mainMod, P, pin
bind = $mainMod CTRL, T, exec, hyprctl setprop active opaque toggle
bind = $mainMod, U, focusurgentorlast
bind = $mainMod ALT, G, togglegroup
bind = $mainMod, F1, exec, ~/.config/hypr/gamemode.sh

# Move focus
$moveFocusSound = ~/.config/SFX/Select.wav
bind = $mainMod, right, exec, (\
	$isDwindle && hyprctl dispatch movefocus r || \
	$isScrolling && hyprctl dispatch layoutmsg focus r \
) && paplay $moveFocusSound
bind = $mainMod, left, exec, (\
	$isDwindle && hyprctl dispatch movefocus l || \
	$isScrolling && hyprctl dispatch layoutmsg focus l \
) && paplay $moveFocusSound
bind = $mainMod, up, exec, (\
	$isDwindle && hyprctl dispatch movefocus u || \
	$isScrolling && hyprctl dispatch layoutmsg focus u \
) && paplay $moveFocusSound
bind = $mainMod, down, exec, (\
	$isDwindle && hyprctl dispatch movefocus d || \
	$isScrolling && hyprctl dispatch layoutmsg focus d \
) && paplay $moveFocusSound

# Move windows
$moveWindowSound = ~/.config/SFX/Switch.wav
bind = $mainMod ALT, right, exec, (\
	$isDwindle && hyprctl dispatch movewindow r || \
	$isScrolling && hyprctl dispatch layoutmsg movewindowto r \
) && paplay $moveWindowSound
bind = $mainMod ALT, left, exec, (\
	$isDwindle && hyprctl dispatch movewindow l || \
	$isScrolling && hyprctl dispatch layoutmsg movewindowto l \
) && paplay $moveWindowSound
bind = $mainMod ALT, up, exec, (\
	$isDwindle && hyprctl dispatch movewindow u || \
	$isScrolling && hyprctl dispatch layoutmsg movewindowto u \
) && paplay $moveWindowSound
bind = $mainMod ALT, down, exec, (\
	$isDwindle && hyprctl dispatch movewindow d || \
	$isScrolling && hyprctl dispatch layoutmsg movewindowto d \
) && paplay $moveWindowSound
bindm = $mainMod ALT, mouse:272, movewindow

# Swap windows
$swapWindowSound = ~/.config/SFX/Switch.wav
bind = $mainMod SHIFT, right, exec, (\
	$isDwindle && hyprctl dispatch swapwindow r || \
	$isScrolling && hyprctl dispatch layoutmsg swapcol r \
) && paplay $swapWindowSound
bind = $mainMod SHIFT, left, exec, (\
	$isDwindle && hyprctl dispatch swapwindow l || \
	$isScrolling && hyprctl dispatch layoutmsg swapcol l \
) && paplay $swapWindowSound
bind = $mainMod SHIFT, up, exec, (\
	$isDwindle && hyprctl dispatch swapwindow u || \
	$isScrolling && hyprctl dispatch layoutmsg swapcol u \
) && paplay $swapWindowSound
bind = $mainMod SHIFT, down, exec, (\
	$isDwindle && hyprctl dispatch swapwindow d || \
	$isScrolling && hyprctl dispatch layoutmsg swapcol d \
) && paplay $swapWindowSound

# Resize windows
$resizeWindowSound = ~/.config/SFX/Select.wav
bind = $mainMod CTRL, right, exec, (\
	$isDwindle && hyprctl dispatch resizeactive 100 0 || \
	$isScrolling && hyprctl dispatch layoutmsg colresize +0.025 r \
) && paplay $resizeWindowSound
bind = $mainMod CTRL, left, exec, (\
	$isDwindle && hyprctl dispatch resizeactive -100 0 || \
	$isScrolling && hyprctl dispatch layoutmsg colresize -0.025 l \
) && paplay $resizeWindowSound
bind = $mainMod CTRL, up, exec, $isDwindle && hyprctl dispatch resizeactive 0 -100 && paplay $resizeWindowSound
bind = $mainMod CTRL, down, exec, $isDwindle && hyprctl dispatch resizeactive 0 100 && paplay $resizeWindowSound
bindm = $mainMod ALT, mouse:273, resizewindow

# Toggle split(dwindle)/resize(scrolling)
bind = $mainMod, S, exec, (\
	$isDwindle && hyprctl dispatch togglesplit || \
	$isScrolling && hyprctl dispatch layoutmsg colresize +conf \
) && paplay $resizeWindowSound
bind = $mainMod ALT, S, exec, (\
	$isDwindle && hyprctl dispatch togglesplit || \
	$isScrolling && hyprctl dispatch layoutmsg colresize -- -conf \
) && paplay $resizeWindowSound

# Switch workspaces
$switchWorkspaceSound = ~/.config/SFX/Switch.wav
bind = $mainMod, 1, exec, hyprctl dispatch workspace 1 && paplay $switchWorkspaceSound
bind = $mainMod, 2, exec, hyprctl dispatch workspace 2 && paplay $switchWorkspaceSound
bind = $mainMod, 3, exec, hyprctl dispatch workspace 3 && paplay $switchWorkspaceSound
bind = $mainMod, 4, exec, hyprctl dispatch workspace 4 && paplay $switchWorkspaceSound
bind = $mainMod, 5, exec, hyprctl dispatch workspace 5 && paplay $switchWorkspaceSound
bind = $mainMod, 6, exec, hyprctl dispatch workspace 6 && paplay $switchWorkspaceSound
bind = $mainMod, 7, exec, hyprctl dispatch workspace 7 && paplay $switchWorkspaceSound
bind = $mainMod, 8, exec, hyprctl dispatch workspace 8 && paplay $switchWorkspaceSound
bind = $mainMod, 9, exec, hyprctl dispatch workspace 9 && paplay $switchWorkspaceSound
bind = $mainMod, 0, exec, hyprctl dispatch workspace 10 && paplay $switchWorkspaceSound

# Move active window to a workspace
bind = $mainMod SHIFT, 1, exec, hyprctl dispatch movetoworkspace 1 && paplay $switchWorkspaceSound
bind = $mainMod SHIFT, 2, exec, hyprctl dispatch movetoworkspace 2 && paplay $switchWorkspaceSound
bind = $mainMod SHIFT, 3, exec, hyprctl dispatch movetoworkspace 3 && paplay $switchWorkspaceSound
bind = $mainMod SHIFT, 4, exec, hyprctl dispatch movetoworkspace 4 && paplay $switchWorkspaceSound
bind = $mainMod SHIFT, 5, exec, hyprctl dispatch movetoworkspace 5 && paplay $switchWorkspaceSound
bind = $mainMod SHIFT, 6, exec, hyprctl dispatch movetoworkspace 6 && paplay $switchWorkspaceSound
bind = $mainMod SHIFT, 7, exec, hyprctl dispatch movetoworkspace 7 && paplay $switchWorkspaceSound
bind = $mainMod SHIFT, 8, exec, hyprctl dispatch movetoworkspace 8 && paplay $switchWorkspaceSound
bind = $mainMod SHIFT, 9, exec, hyprctl dispatch movetoworkspace 9 && paplay $switchWorkspaceSound
bind = $mainMod SHIFT, 0, exec, hyprctl dispatch movetoworkspace 10 && paplay $switchWorkspaceSound
bind = $mainMod CTRL SHIFT, Right, exec, hyprctl dispatch movetoworkspace e+1 && paplay $switchWorkspaceSound
bind = $mainMod CTRL SHIFT, Left, exec, hyprctl dispatch movetoworkspace e-1 && paplay $switchWorkspaceSound
bind = $mainMod CTRL SHIFT, up, exec, hyprctl dispatch movetoworkspace e-1 && paplay $switchWorkspaceSound
bind = $mainMod CTRL SHIFT, down, exec, hyprctl dispatch movetoworkspace e+1 && paplay $switchWorkspaceSound

# Special Workspaces
bind = $mainMod, TAB, exec, hyprctl dispatch togglespecialworkspace special && paplay $switchWorkspaceSound
bind = $mainMod SHIFT, TAB, exec, pypr toggle_special special && paplay $switchWorkspaceSound

# Keyboard
$switchKeyboardSound = ~/.config/SFX/Select.wav
bind = $mainMod, F2, exec, hyprctl switchxkblayout current next && notify-send -t 1000 --hint=string:x-dunst-stack-tag:keyboard_layout "Switched Keyboard Layout" "$(hyprctl devices -j | jq -r '.keyboards[] | select(.main == true) | .active_keymap')" && paplay $switchKeyboardSound

# Dunst DND
$dndSound = ~/.config/SFX/Select.wav
bind = $mainMod, N, exec, notify-send -t 1000 --hint=string:x-dunst-stack-tag:dnd "Disabled Notifications" && paplay $dndSound
bind = $mainMod, N, exec, sleep 1 && dunstctl set-pause-level 100
bind = $mainMod ALT, N, exec, notify-send -t 1000 --hint=string:x-dunst-stack-tag:dnd "Enabled Notifications" && paplay $dndSound
bind = $mainMod ALT, N, exec, dunstctl set-pause-level 0

# Runners
$runnerSound = ~/.config/SFX/Switch.wav
bind = $mainMod, R, exec, rofi -modes drun,run -show drun | paplay $runnerSound
bind = $mainMod ALT, C, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy | paplay $runnerSound
bind = $mainMod ALT, R, exec, rofi -show calc -modi calc -no-show-match -no-sort -terse -calc-command | wl-copy | paplay $runnerSound
bind = $mainMod ALT, T, exec, ~/Packages/RofiTranslate/RofiTranslate.sh | paplay $runnerSound
bind = $mainMod ALT, E, exec, rofi -show emoji | paplay $runnerSound

# Apps
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, T, exec, xdg-terminal-exec $textEditor
bind = $mainMod, ESCAPE, exec, xdg-terminal-exec btop
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, O, exec, obs --disable-shutdown-check && paplay $appSound
bind = $mainMod, D, exec, /usr/bin/chromium --profile-directory=Default --app-id=kmcnjdcipmgchfndpapkoecbidofdpbc %U
bind = $mainMod ALT, P, exec, hyprpicker -a
bind = $mainMod CTRL SHIFT, L, exec, hyprlock

# Background
bind = $mainMod, W, exec, ~/Data/Projects/Unity/Nisualizer/Builds/Linux/Nisualizer.x86_64
bind = $mainMod ALT, W, exec, killall Nisualizer.x86_64

# Zoom
bind = $mainMod ALT, mouse_down, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float * 1.1')
bind = $mainMod ALT, mouse_up, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 0.9) | if . < 1 then 1 else . end')
binde = $mainMod, equal, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float * 1.5')
binde = $mainMod, minus, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 0.5) | if . < 1 then 1 else . end')

# Screenshotting
$screenshotSound = ~/.config/SFX/Select.wav
bind = , Print, exec, grim - | wl-copy && notify-send -t 2000 "Grim" "Screenshot Taken!"; paplay $screenshotSound
#bind = , Print, exec, hyprshot -m output -t 2000 --clipboard-only; paplay $screenshotSound # Entire Screen USE ONLY IF YOU HAVE MULTIPLE MONITORS
bind = ALT, X, exec, hyprshot -m region -z -t 2000 --clipboard-only; paplay $screenshotSound # Regional
bind = $mainMod ALT, X, exec, hyprshot -m window -m active -t 2000 --clipboard-only; paplay $screenshotSound # Active Window
bind = $mainMod CTRL, X, exec, hyprshot -m window -z -t 2000 --clipboard-only; paplay $screenshotSound # Window

# Global Binds
$instantReplay = F10
$instantReplaySound = ~/.config/SFX/Select.wav
bind = , $instantReplay, pass, class:^(com\.obsproject\.Studio)$
bind = , $instantReplay, exec, notify-send -t 1000 "OBS" "Instant Replay Saved"
bind = , $instantReplay, exec, paplay $instantReplaySound

# Keyboard Mouse Control
bind = $mainMod, M, exec, python ~/Data/Projects/Hyprmouse/Hyprmouse.py
bind = $mainMod ALT, M, exec, fish -c "hints"

# Ydotool Click
bind = $mainMod, SPACE, exec, ydotool click C0
bind = $mainMod ALT, SPACE, exec, ydotool click C1
bind = $mainMod CTRL, SPACE, exec, ydotool click C2

# Ydotool Mouse Down
#bind = $mainMod, RETURN, exec, ydotool click 0x40
#bind = $mainMod ALT, RETURN, exec, ydotool click 0x41
#bind = $mainMod CTRL, RETURN, exec, ydotool click 0x42

# Ydotool Mouse Up
#bind = $mainMod, RETURN, exec, ydotool click 0x80
#bind = $mainMod ALT, RETURN, exec, ydotool click 0x81
#bind = $mainMod CTRL, RETURN, exec, ydotool click 0x82

# Ydotool Normal
$normalMove = 250
binde = $mainMod, H, exec, ydotool mousemove -x -$normalMove, -y 0
binde = $mainMod, J, exec, ydotool mousemove -x 0, -y $normalMove
binde = $mainMod, K, exec, ydotool mousemove -x 0, -y -$normalMove
binde = $mainMod, L, exec, ydotool mousemove -x $normalMove, -y 0

# Ydotool Small
$mediumMove = 50
binde = $mainMod ALT, H, exec, ydotool mousemove -x -$mediumMove, -y 0
binde = $mainMod ALT, J, exec, ydotool mousemove -x 0, -y $mediumMove
binde = $mainMod ALT, K, exec, ydotool mousemove -x 0, -y -$mediumMove
binde = $mainMod ALT, L, exec, ydotool mousemove -x $mediumMove, -y 0

# Ydotool Big
$smallMove = 10
binde = $mainMod SHIFT, H, exec, ydotool mousemove -x -$smallMove, -y 0
binde = $mainMod SHIFT, J, exec, ydotool mousemove -x 0, -y $smallMove
binde = $mainMod SHIFT, K, exec, ydotool mousemove -x 0, -y -$smallMove
binde = $mainMod SHIFT, L, exec, ydotool mousemove -x $smallMove, -y 0

# Media Controls(Requires playerctl)
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86audiostop, exec, playerctl stop

# PipeWire Audio Control
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

# Input and Output Mute
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

# Shaders
bind = $mainMod ALT, B, exec, hyprshade toggle blue-light-filter && paplay ~/.config/SFX/Select.wav
bind = $mainMod ALT, I, exec, hyprshade toggle invert-colors && paplay ~/.config/SFX/Select.wav
bind = $mainMod ALT, V, exec, hyprshade toggle vibrance && paplay ~/.config/SFX/Select.wav
#bind = $mainMod ALT, S, exec, hyprshade toggle Hyprstorm && paplay ~/.config/SFX/Select.wav
#bind = $mainMod ALT, H, exec, hyprshade toggle hue_shift && paplay ~/.config/SFX/Select.wav

# Misc
bind = $mainMod CTRL, U, exec, sh ~/.config/hypr/HyprlandUnityFix/ReloadUnity.sh # Spawns a terminal and quickly switches focus to trigger a Unity reload
#hyprlang noerror true
bind = $mainMod, grave, hyprexpo:expo, toggle # Workspace overview
bind = $mainMod, grave, exec, paplay ~/.config/SFX/Switch.wav
bind = $mainMod ALT, D, invertactivewindow # Inverts colors of the active window
bind = $mainMod ALT, D, exec, paplay ~/.config/SFX/Select.wav
#hyprlang noerror false
