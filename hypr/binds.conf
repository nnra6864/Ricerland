# Setting this any higher causes weird behaviour
binds:scroll_event_delay = 1

# Hypr
bind = $mainMod SHIFT, P, exit
bind = $mainMod ALT, P, exec, xdph

# Window Management
bind = $mainMod, F, fullscreen
bind = $mainMod CTRL, F, fullscreenstate, 0, 3 # Fake fullscreen
bind = $mainMod ALT, F, fullscreenstate, 1 # Maximize
bind = $mainMod, V, togglefloating
bind = $mainMod, C, killactive
bind = $mainMod, mouse:274, killactive
bind = $mainMod, X, centerwindow
bind = $mainMod, Z, pseudo
bind = $mainMod, P, pin
bind = $mainMod CTRL, T, exec, hyprctl setprop active opaque toggle
bind = $mainMod, U, focusurgentorlast
bind = $mainMod ALT, G, togglegroup
bind = $mainMod, F1, exec, ~/.config/hypr/gamemode.sh

# Move focus
bind = $mainMod, right, exec, hyprctl dispatch layoutmsg focus r || hyprctl dispatch movefocus r
bind = $mainMod, left, exec, hyprctl dispatch layoutmsg focus l || hyprctl dispatch movefocus l
bind = $mainMod, up, exec, hyprctl dispatch layoutmsg focus u || hyprctl dispatch movefocus u
bind = $mainMod, down, exec, hyprctl dispatch layoutmsg focus u || hyprctl dispatch movefocus d

# Move windows
bind = $mainMod ALT, right, exec, hyprctl dispatch layoutmsg movewindowto r || hyprctl dispatch movewindow r
bind = $mainMod ALT, left, exec, hyprctl dispatch layoutmsg movewindowto l || hyprctl dispatch movewindow l
bind = $mainMod ALT, up, exec, hyprctl dispatch layoutmsg movewindowto u || hyprctl dispatch movewindow u
bind = $mainMod ALT, down, exec, hyprctl dispatch layoutmsg movewindowto d || hyprctl dispatch movewindow d
bindm = $mainMod ALT, mouse:272, movewindow

# Swap windows
bind = $mainMod SHIFT, right, exec, hyprctl dispatch layoutmsg swapcol r || hyprctl dispatch swapwindow r
bind = $mainMod SHIFT, left, exec, hyprctl dispatch layoutmsg swapcol l || hyprctl dispatch swapwindow l
bind = $mainMod SHIFT, up, exec, hyprctl dispatch layoutmsg swapcol u || hyprctl dispatch swapwindow u
bind = $mainMod SHIFT, down, exec, hyprctl dispatch layoutmsg swapcol d || hyprctl dispatch swapwindow d

# Resize windows
bind = $mainMod CTRL, right, exec, hyprctl dispatch layoutmsg colresize +0.025 r || resizeactive, 100 0
bind = $mainMod CTRL, left, exec, hyprctl dispatch layoutmsg colresize -0.025 l || resizeactive, -100 0
bind = $mainMod CTRL, up, exec, resizeactive, 0 -100
bind = $mainMod CTRL, down, exec, resizeactive, 0 100
bindm = $mainMod ALT, mouse:273, resizewindow

# Toggle split(dwindle)/resize(scrolling)
bind = $mainMod, S, exec, (hyprctl dispatch layoutmsg colresize +conf || togglesplit)
bind = $mainMod ALT, S, exec, hyprctl -- dispatch layoutmsg colresize -conf || togglesplit

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod CTRL SHIFT, Left, movetoworkspace, e-1
bind = $mainMod CTRL SHIFT, Right, movetoworkspace, e+1

# Special Workspaces
bind = $mainMod, TAB, togglespecialworkspace, special
bind = $mainMod SHIFT, TAB, exec, pypr toggle_special special

# Keyboard
bind = $mainMod, F2, exec, hyprctl switchxkblayout current next && notify-send -t 1000 --hint=string:x-dunst-stack-tag:keyboard_layout "Switched Keyboard Layout" "$(hyprctl devices -j | jq -r '.keyboards[] | select(.main == true) | .active_keymap')"

# Dunst DND
bind = $mainMod, N, exec, notify-send -t 1000 --hint=string:x-dunst-stack-tag:dnd "Disabled Notifications"
bind = $mainMod, N, exec, sleep 1 && dunstctl set-pause-level 100
bind = $mainMod ALT, N, exec, notify-send -t 1000 --hint=string:x-dunst-stack-tag:dnd "Enabled Notifications"
bind = $mainMod ALT, N, exec, dunstctl set-pause-level 0

# Runners
bind = $mainMod, R, exec, rofi -modes drun,run -show drun
bind = $mainMod ALT, C, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = $mainMod ALT, R, exec, rofi -show calc -modi calc -no-show-match -no-sort -terse -calc-command | wl-copy
bind = $mainMod ALT, T, exec, ~/Packages/RofiTranslate/RofiTranslate.sh
bind = $mainMod ALT, E, exec, rofi -show emoji

# Apps
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, T, exec, xdg-terminal-exec $textEditor
bind = $mainMod, ESCAPE, exec, xdg-terminal-exec btop
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, O, exec, obs --disable-shutdown-check
bind = $mainMod, D, exec, /usr/bin/chromium --profile-directory=Default --app-id=kmcnjdcipmgchfndpapkoecbidofdpbc %U
bind = $mainMod ALT, P, exec, hyprpicker -a
bind = $mainMod CTRL SHIFT, L, exec, hyprlock

# Background
bind = $mainMod, W, exec, ~/Data/Projects/Unity/Nisualizer/Builds/Linux/Nisualizer.x86_64
bind = $mainMod ALT, W, exec, killall Nisualizer.x86_64

# Zoom
bind = $mainMod ALT, mouse_down, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float * 1.1')
bind = $mainMod ALT, mouse_up, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 0.9) | if . < 1 then 1 else . end')
binde = $mainMod, equal, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float * 1.5')
binde = $mainMod, minus, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 0.5) | if . < 1 then 1 else . end')

# Screenshotting
bind = , Print, exec, grim - | wl-copy && notify-send -t 2000 "Grim" "Screenshot Taken!"
#bind = , Print, exec, hyprshot -m output -t 2000 --clipboard-only # Entire Screen USE ONLY IF YOU HAVE MULTIPLE MONITORS
bind = ALT, X, exec, hyprshot -m region -z -t 2000 --clipboard-only # Regional
bind = $mainMod ALT, X, exec, hyprshot -m window -m active -t 2000 --clipboard-only #A ctive Window
bind = $mainMod CTRL, X, exec, hyprshot -m window -z -t 2000 --clipboard-only # Window

# Global Binds
$instantReplay = F10
bind = , $instantReplay, pass, class:^(com\.obsproject\.Studio)$
bind = , $instantReplay, exec, notify-send -t 1000 "OBS" "Instant Replay Saved"
bind = , $instantReplay, exec, paplay /usr/share/sounds/freedesktop/stereo/message.oga

# Keyboard Mouse Control
bind = $mainMod, M, exec, python ~/Data/Projects/Hyprmouse/Hyprmouse.py
bind = $mainMod ALT, M, exec, fish -c "hints"

# Ydotool Click
bind = $mainMod, SPACE, exec, ydotool click C0
bind = $mainMod ALT, SPACE, exec, ydotool click C1
bind = $mainMod CTRL, SPACE, exec, ydotool click C2

# Ydotool Mouse Down
#bind = $mainMod, RETURN, exec, ydotool click 0x40
#bind = $mainMod ALT, RETURN, exec, ydotool click 0x41
#bind = $mainMod CTRL, RETURN, exec, ydotool click 0x42

# Ydotool Mouse Up
#bind = $mainMod, RETURN, exec, ydotool click 0x80
#bind = $mainMod ALT, RETURN, exec, ydotool click 0x81
#bind = $mainMod CTRL, RETURN, exec, ydotool click 0x82

# Ydotool Normal
$normalMove = 250
binde = $mainMod, H, exec, ydotool mousemove -x -$normalMove, -y 0
binde = $mainMod, J, exec, ydotool mousemove -x 0, -y $normalMove
binde = $mainMod, K, exec, ydotool mousemove -x 0, -y -$normalMove
binde = $mainMod, L, exec, ydotool mousemove -x $normalMove, -y 0

# Ydotool Small
$mediumMove = 50
binde = $mainMod ALT, H, exec, ydotool mousemove -x -$mediumMove, -y 0
binde = $mainMod ALT, J, exec, ydotool mousemove -x 0, -y $mediumMove
binde = $mainMod ALT, K, exec, ydotool mousemove -x 0, -y -$mediumMove
binde = $mainMod ALT, L, exec, ydotool mousemove -x $mediumMove, -y 0

# Ydotool Big
$smallMove = 10
binde = $mainMod SHIFT, H, exec, ydotool mousemove -x -$smallMove, -y 0
binde = $mainMod SHIFT, J, exec, ydotool mousemove -x 0, -y $smallMove
binde = $mainMod SHIFT, K, exec, ydotool mousemove -x 0, -y -$smallMove
binde = $mainMod SHIFT, L, exec, ydotool mousemove -x $smallMove, -y 0

# Media Controls(Requires playerctl)
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86audiostop, exec, playerctl stop

# PipeWire Audio Control
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

# Input and Output Mute
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

# Shaders
bind = $mainMod ALT, B, exec, hyprshade toggle blue-light-filter
bind = $mainMod ALT, I, exec, hyprshade toggle invert-colors
bind = $mainMod ALT, V, exec, hyprshade toggle vibrance
#bind = $mainMod ALT, S, exec, hyprshade toggle Hyprstorm
#bind = $mainMod ALT, H, exec, hyprshade toggle hue_shift

# Misc
bind = $mainMod CTRL, U, exec, sh ~/.config/hypr/HyprlandUnityFix/ReloadUnity.sh # Spawns a terminal and quickly switches focus to trigger a Unity reload
#hyprlang noerror true
bind = $mainMod, grave, hyprexpo:expo, toggle # Workspace overview
bind = $mainMod ALT, D, invertactivewindow # Inverts colors of the active window
#hyprlang noerror false
