binds {
    scroll_event_delay = 1 # Fixes scroll binds not registering properly
    hide_special_on_workspace_change = true
    movefocus_cycles_fullscreen = false
}

# Window Management
bind = $mainMod, F, fullscreen
bind = $mainMod CTRL, F, fullscreenstate, 0, 3 # Fake fullscreen
bind = $mainMod ALT, F, fullscreenstate, 1 # Maximize
bind = $mainMod, V, togglefloating
bind = $mainMod, C, killactive
bind = $mainMod, mouse:274, killactive
bind = $mainMod, X, centerwindow
bind = $mainMod, Z, pseudo
bind = $mainMod, P, pin
bind = $mainMod CTRL, T, exec, hyprctl dispatch setprop active opaque toggle
bind = $mainMod, U, focusurgentorlast
bind = $mainMod ALT, G, togglegroup
bind = $mainMod, F1, exec, ~/.config/hypr/gamemode.sh

# Move focus
$moveFocusSound = ~/.config/SFX/Select.wav

$moveFocusRightCmd = (\
    $isDwindle && hyprctl dispatch movefocus r || \
    $isScrolling && hyprctl dispatch layoutmsg focus r \
)
bind = $mainMod, right, exec, $moveFocusRightCmd
bind = $mainMod, l, exec, $moveFocusRightCmd

$moveFocusLeftCmd = (\
    $isDwindle && hyprctl dispatch movefocus l || \
    $isScrolling && hyprctl dispatch layoutmsg focus l \
)
bind = $mainMod, left, exec, $moveFocusLeftCmd
bind = $mainMod, h, exec, $moveFocusLeftCmd

$moveFocusUpCmd = (\
    $isDwindle && hyprctl dispatch movefocus u || \
    $isScrolling && hyprctl dispatch layoutmsg focus u \
)
bind = $mainMod, up, exec, $moveFocusUpCmd
bind = $mainMod, k, exec, $moveFocusUpCmd

$moveFocusDownCmd = (\
    $isDwindle && hyprctl dispatch movefocus d || \
    $isScrolling && hyprctl dispatch layoutmsg focus d \
)
bind = $mainMod, down, exec, $moveFocusDownCmd
bind = $mainMod, j, exec, $moveFocusDownCmd

bind = $mainMod, T, exec, hyprctl dispatch cyclenext prev

# Move windows
$moveWindowSound = ~/.config/SFX/Switch.wav

$moveWindowRightCmd = (\
    $isDwindle && hyprctl dispatch movewindow r || \
    $isScrolling && hyprctl dispatch layoutmsg movewindowto r \
)
bind = $mainMod ALT, right, exec, $moveWindowRightCmd
bind = $mainMod ALT, l, exec, $moveWindowRightCmd

$moveWindowLeftCmd = (\
    $isDwindle && hyprctl dispatch movewindow l || \
    $isScrolling && hyprctl dispatch layoutmsg movewindowto l \
)
bind = $mainMod ALT, left, exec, $moveWindowLeftCmd
bind = $mainMod ALT, h, exec, $moveWindowLeftCmd

$moveWindowUpCmd = (\
    $isDwindle && hyprctl dispatch movewindow u || \
    $isScrolling && hyprctl dispatch layoutmsg movewindowto u \
)
bind = $mainMod ALT, up, exec, $moveWindowUpCmd
bind = $mainMod ALT, k, exec, $moveWindowUpCmd

$moveWindowDownCmd = (\
    $isDwindle && hyprctl dispatch movewindow d || \
    $isScrolling && hyprctl dispatch layoutmsg movewindowto d \
)
bind = $mainMod ALT, down, exec, $moveWindowDownCmd
bind = $mainMod ALT, j, exec, $moveWindowDownCmd

bindm = $mainMod ALT, mouse:272, movewindow

# Swap windows
$swapWindowSound = ~/.config/SFX/Switch.wav

$swapWindowRightCmd = (\
    $isDwindle && hyprctl dispatch swapwindow r || \
    $isScrolling && hyprctl dispatch layoutmsg swapcol r \
)
bind = $mainMod SHIFT, right, exec, $swapWindowRightCmd
bind = $mainMod SHIFT, l, exec, $swapWindowRightCmd

$swapWindowLeftCmd = (\
    $isDwindle && hyprctl dispatch swapwindow l || \
    $isScrolling && hyprctl dispatch layoutmsg swapcol l \
)
bind = $mainMod SHIFT, left, exec, $swapWindowLeftCmd
bind = $mainMod SHIFT, h, exec, $swapWindowLeftCmd

$swapWindowUpCmd = (\
    $isDwindle && hyprctl dispatch swapwindow u || \
    $isScrolling && hyprctl dispatch layoutmsg swapcol u \
)
bind = $mainMod SHIFT, up, exec, $swapWindowUpCmd
bind = $mainMod SHIFT, k, exec, $swapWindowUpCmd

$swapWindowDownCmd = (\
    $isDwindle && hyprctl dispatch swapwindow d || \
    $isScrolling && hyprctl dispatch layoutmsg swapcol d \
)
bind = $mainMod SHIFT, down, exec, $swapWindowDownCmd
bind = $mainMod SHIFT, j, exec, $swapWindowDownCmd

# Resize windows
$resizeWindowSound = ~/.config/SFX/Select.wav

$resizeWindowRightCmd = (\
    $isDwindle && hyprctl dispatch resizeactive 100 0 || \
    $isScrolling && hyprctl dispatch layoutmsg colresize +0.025 r \
)
bind = $mainMod CTRL, right, exec, $resizeWindowRightCmd
bind = $mainMod CTRL, l, exec, $resizeWindowRightCmd

$resizeWindowLeftCmd = (\
    $isDwindle && hyprctl dispatch resizeactive -100 0 || \
    $isScrolling && hyprctl dispatch layoutmsg colresize -0.025 l \
)
bind = $mainMod CTRL, left, exec, $resizeWindowLeftCmd
bind = $mainMod CTRL, h, exec, $resizeWindowLeftCmd

bind = $mainMod CTRL, up, exec, $isDwindle && hyprctl dispatch resizeactive 0 -100
bind = $mainMod CTRL, down, exec, $isDwindle && hyprctl dispatch resizeactive 0 100
bindm = $mainMod ALT, mouse:273, resizewindow

# Toggle split(dwindle)/resize(scrolling)
bind = $mainMod, S, exec, (\
    $isDwindle && hyprctl dispatch togglesplit || \
    $isScrolling && hyprctl dispatch layoutmsg colresize +conf \
)
bind = $mainMod ALT, S, exec, (\
    $isDwindle && hyprctl dispatch togglesplit || \
    $isScrolling && hyprctl dispatch layoutmsg colresize -- -conf \
)

# Switch workspaces
$switchWorkspaceSound = ~/.config/SFX/Switch.wav
bind = $mainMod, 1, exec, hyprctl dispatch workspace 1
bind = $mainMod, 2, exec, hyprctl dispatch workspace 2
bind = $mainMod, 3, exec, hyprctl dispatch workspace 3
bind = $mainMod, 4, exec, hyprctl dispatch workspace 4
bind = $mainMod, 5, exec, hyprctl dispatch workspace 5
bind = $mainMod, 6, exec, hyprctl dispatch workspace 6
bind = $mainMod, 7, exec, hyprctl dispatch workspace 7
bind = $mainMod, 8, exec, hyprctl dispatch workspace 8
bind = $mainMod, 9, exec, hyprctl dispatch workspace 9
bind = $mainMod, 0, exec, hyprctl dispatch workspace 10

# Move active window to a workspace
bind = $mainMod SHIFT, 1, exec, hyprctl dispatch movetoworkspace 1
bind = $mainMod SHIFT, 2, exec, hyprctl dispatch movetoworkspace 2
bind = $mainMod SHIFT, 3, exec, hyprctl dispatch movetoworkspace 3
bind = $mainMod SHIFT, 4, exec, hyprctl dispatch movetoworkspace 4
bind = $mainMod SHIFT, 5, exec, hyprctl dispatch movetoworkspace 5
bind = $mainMod SHIFT, 6, exec, hyprctl dispatch movetoworkspace 6
bind = $mainMod SHIFT, 7, exec, hyprctl dispatch movetoworkspace 7
bind = $mainMod SHIFT, 8, exec, hyprctl dispatch movetoworkspace 8
bind = $mainMod SHIFT, 9, exec, hyprctl dispatch movetoworkspace 9
bind = $mainMod SHIFT, 0, exec, hyprctl dispatch movetoworkspace 10
bind = $mainMod CTRL SHIFT, Right, exec, hyprctl dispatch movetoworkspace e+1
bind = $mainMod CTRL SHIFT, Left, exec, hyprctl dispatch movetoworkspace e-1
bind = $mainMod CTRL SHIFT, up, exec, hyprctl dispatch movetoworkspace e-1
bind = $mainMod CTRL SHIFT, down, exec, hyprctl dispatch movetoworkspace e+1

# Special Workspaces
bind = $mainMod, TAB, exec, hyprctl dispatch togglespecialworkspace special
bind = $mainMod SHIFT, TAB, exec, pypr-client toggle_special special

bind = $mainMod, F5, exec, hyprctl keyword monitor "DP-2,highres@highrr,0x0,1,bitdepth,10"
bind = $mainMod, F6, exec, hyprctl keyword monitor "DP-2,2560x1440@240,0x0,1,bitdepth,10"

# Keyboard
$switchKeyboardSound = ~/.config/SFX/Select.wav
bind = $mainMod, F2, exec, hyprctl switchxkblayout current next && notify-send -t 1000 --hint=string:x-dunst-stack-tag:keyboard_layout "Switched Keyboard Layout" "$(hyprctl devices -j | jq -r '.keyboards[] | select(.main == true) | .active_keymap')" && paplay $switchKeyboardSound

# Runners
$runnerSound = ~/.config/SFX/Switch.wav
bind = $mainMod, SPACE, exec, wlr-which-key
bind = $mainMod, A, exec, wlr-which-key --initial-keys "a"
bind = $mainMod, B, exec, wlr-which-key --initial-keys "a b"
bind = $mainMod, P, exec, wlr-which-key --initial-keys "p"
bind = $mainMod, U, exec, wlr-which-key --initial-keys "u"
bind = $mainMod, N, exec, wlr-which-key --initial-keys "n"
bind = $mainMod, R, exec, vicinae toggle

# Apps
bind = $mainMod, Q, exec, $terminal_command
bind = $mainMod, ESCAPE, exec, xdg-terminal-exec btop
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, O, exec, obs --disable-shutdown-check
bind = $mainMod ALT, P, exec, hyprpicker -a
bind = $mainMod CTRL SHIFT, L, exec, hyprlock

# Background
bind = $mainMod, W, exec, ~/Data/Projects/Unity/Nisualizer/Builds/Linux/Nisualizer.x86_64
bind = $mainMod ALT, W, exec, killall Nisualizer.x86_64

# Zoom
bind = $mainMod, mouse_down, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float * 1.1')
bind = $mainMod, mouse_up, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 0.9) | if . < 1 then 1 else . end')
binde = $mainMod, equal, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float * 1.5')
binde = $mainMod, minus, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 0.5) | if . < 1 then 1 else . end')

# Screenshotting
$screenshotSound = ~/.config/SFX/Select.wav
bind = , Print, exec, grim - | wl-copy && notify-send -t 2000 "Grim" "Screenshot Taken!"; paplay $screenshotSound
#bind = , Print, exec, hyprshot -m output -t 2000 --clipboard-only; paplay $screenshotSound # Entire Screen USE ONLY IF YOU HAVE MULTIPLE MONITORS
bind = ALT, X, exec, hyprshot -m region -z -t 2000 --clipboard-only; paplay $screenshotSound # Regional
bind = $mainMod ALT, X, exec, hyprshot -m window -m active -t 2000 --clipboard-only; paplay $screenshotSound # Active Window
bind = $mainMod CTRL, X, exec, hyprshot -m window -z -t 2000 --clipboard-only; paplay $screenshotSound # Window

# Global Binds
$instantReplay = F10
$instantReplaySound = ~/.config/SFX/Select.wav
bind = , $instantReplay, pass, class:^(com\.obsproject\.Studio)$
bind = , $instantReplay, exec, notify-send -t 1000 "OBS" "Instant Replay Saved"
bind = , $instantReplay, exec, paplay $instantReplaySound

# Passthrough
bind = $mainMod CTRL SHIFT, P, submap, passthru
submap = passthru
bind = $mainMod, Escape, submap, reset
submap = reset

# Hyprmouse and Hints
bind = $mainMod SHIFT, M, exec, python ~/Data/Projects/Hyprmouse/Hyprmouse.py
bind = $mainMod ALT, M, exec, fish -c "hints"

# Keyboard mouse control
bind = $mainMod, M, submap, mouse
submap = mouse

# Ydotool Click
#bind = , SPACE, exec, ydotool click C0
#bind = , RETURN, exec, ydotool click C1
#bind = , C, exec, ydotool click C2

# Ydotool Mouse Down
bind = , SPACE, exec, ydotool click 0x40
bind = , RETURN, exec, ydotool click 0x41
bind = , C, exec, ydotool click 0x42

# Ydotool Mouse Up
bindr = , SPACE, exec, ydotool click 0x80
bindr = , RETURN, exec, ydotool click 0x81
bindr = , C, exec, ydotool click 0x82

# Ydotool Move Big
$bigMove = 200
binde = SHIFT, H, exec, ydotool mousemove -x -$bigMove, -y 0
binde = SHIFT, J, exec, ydotool mousemove -x 0, -y $bigMove
binde = SHIFT, K, exec, ydotool mousemove -x 0, -y -$bigMove
binde = SHIFT, L, exec, ydotool mousemove -x $bigMove, -y 0

# Ydotool Move Small
$smallMove = 10
binde = , H, exec, ydotool mousemove -x -$smallMove, -y 0
binde = , J, exec, ydotool mousemove -x 0, -y $smallMove
binde = , K, exec, ydotool mousemove -x 0, -y -$smallMove
binde = , L, exec, ydotool mousemove -x $smallMove, -y 0

bind = $mainMod, Escape, submap, reset
submap = reset

# Media Controls(Requires playerctl)
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86audiostop, exec, playerctl stop

# PipeWire Audio Control
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

# Input and Output Mute
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

# Brightness
bind = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-
bind = ,XF86MonBrightnessUp, exec, brightnessctl s +10%

# Misc
bind = $mainMod CTRL, U, exec, sh ~/.config/hypr/HyprlandUnityFix/ReloadUnity.sh # Spawns a terminal and quickly switches focus to trigger a Unity reload
#hyprlang noerror true
bind = $mainMod, grave, hyprexpo:expo, toggle # Workspace overview
bind = $mainMod ALT, D, invertactivewindow # Inverts colors of the active window
#hyprlang noerror false
