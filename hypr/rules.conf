# Prevents windows from maximizing/fullscreening themeselves
windowrule = suppress_event maximize, match:class .*
windowrule = suppress_event maximize fullscreen, match:class cs2
windowrule = suppress_event maximize fullscreen, match:class csgo_linux64
windowrule = suppress_event maximize fullscreen, match:class steam_app_730
windowrule = suppress_event maximize fullscreen, match:class hl_linux

# Transparency (some apps don't support native transparency or behave weird when opaque)
#windowrule = opaque true, match:class .*
#windowrule = opaque false, match:class info.mumble.Mumble
#windowrule = opaque false, match:class obsidian
#windowrule = opaque false, match:class org.kde.dolphin

# Tearing
windowrule = immediate true, match:class cs2 # CS2
windowrule = immediate true, match:class steam_app_730 # CSGO/CO/CC
windowrule = immediate true, match:class hl_linux # CS 1.6
windowrule = immediate true, match:class osu! # Osu

# Floating
windowrule = float true, match:class waydroid.com.*
windowrule = fullscreen 1, match:class com.moonlight_stream.Moonlight

# Social Workspace
$socialWorkspace = 2
windowrule = workspace $socialWorkspace silent, match:class info.mumble.Mumble
windowrule = workspace $socialWorkspace silent, match:class equibop
windowrule = workspace $socialWorkspace silent, match:class Revolt
windowrule = workspace $socialWorkspace silent, match:class Element
windowrule = workspace $socialWorkspace silent, match:class vesktop
windowrule = workspace $socialWorkspace silent, match:class org.telegram.desktop
windowrule = workspace $socialWorkspace silent, match:class nheko

# Special Workspace
$specialWorkspace = special
windowrule = match:initial_title ^.*\[Locked\] - KeePassXC$, workspace $specialWorkspace silent, match:class ^org\.keepassxc\.KeePassXC$
windowrule = workspace $specialWorkspace silent, match:class com.ghostty.ncmpcpp
windowrule = workspace $specialWorkspace silent, match:class obsidian
windowrule = workspace $specialWorkspace silent, match:initial_class com.obsproject.Studio

# Nisualizer
windowrule {
	name = Nisualizer
	match:class = Nisualizer.x86_64

	size = 100% 100%
	no_focus = true
	rounding = 0
	#minsize = 5120 1440
}

# Jetbrains
windowrule = match:class jetbrains.*, match:title win.*, no_focus true # Prevents tooltips from stealing focus

# Material Maker
windowrule = match:class Material Maker, match:initial_title Godot, tile true
windowrule = match:class Material Maker, match:title Alert!, float true

# Dunst
layerrule = match:namespace notifications, blur true
layerrule = match:namespace notifications, ignore_alpha 0
layerrule = match:namespace notifications, animation slide

# Hyprlauncher
layerrule = match:namespace hyprlauncher, blur true
layerrule = match:namespace hyprlauncher, ignore_alpha 0
layerrule = match:namespace hyprlauncher, animation slide

# Rofi
layerrule = match:namespace rofi, blur true
layerrule = match:namespace rofi, ignore_alpha 0
layerrule = match:namespace rofi, animation slide

# SwayNC
layerrule = match:namespace swaync-control-center, blur true
layerrule = match:namespace swaync-control-center, ignore_alpha 0
layerrule = match:namespace swaync-control-window, blur true

# Transitioner
layerrule = match:namespace Transitioner, no_anim true

# Slurp(fixes screenshots being white)
layerrule = match:namespace selection, no_anim true

# Hints
layerrule = match:namespace hints, no_anim true

# XWaylandVideoBridge
windowrule {
    name = XWaylandVideoBridge
    match:class = xwaylandvideobridge

    no_initial_focus = true
    no_focus = true
    no_anim = true
    no_blur = true
    max_size = 1 1
    opacity = 0.0
}

