# Prevents windows from maximizing themeselves
windowrule = match:class .*, suppress_event maximize
windowrule = match:class cs2, suppress_event maximize fullscreen
windowrule = match:class csgo_linux64, suppress_event maximize fullscreen
windowrule = match:class steam_app_730, suppress_event maximize fullscreen

# Transparency (some apps behave weirdly when opaque)
windowrule = match:class .*, opaque true
windowrule = match:class info.mumble.Mumble, opaque false
windowrule = match:class obsidian, opaque false

# Tearing
windowrule = match:class cs2, immediate true # CS2
windowrule = match:class steam_app_730, immediate true # CSGO/CO/CC
windowrule = match:class hl_linux, immediate true # CS 1.6
windowrule = match:class osu!, immediate true # Osu

# Social Workspace
$socialWorkspace = 2
windowrule = match:class info.mumble.Mumble, workspace $socialWorkspace silent
windowrule = match:class equibop, workspace $socialWorkspace silent
windowrule = match:class Revolt, workspace $socialWorkspace silent
windowrule = match:class Element, workspace $socialWorkspace silent
windowrule = match:class vesktop, workspace $socialWorkspace silent
windowrule = match:class org.telegram.desktop, workspace $socialWorkspace silent
windowrule = match:class nheko, workspace $socialWorkspace silent

# Special Workspace
$specialWorkspace = special
windowrule = match:class ^org\.keepassxc\.KeePassXC$, match:initial_title ^.*\[Locked\] - KeePassXC$, workspace $specialWorkspace silent
windowrule = match:class com.ghostty.ncmpcpp, workspace $specialWorkspace silent
windowrule = match:class obsidian, workspace $specialWorkspace silent
windowrule = match:initial_class com.obsproject.Studio, workspace $specialWorkspace silent

# Nisualizer
windowrule {
	name = Nisualizer
	match:class = Nisualizer.x86_64

	size = 100% 100%
	no_focus = true
	rounding = 0
	#minsize = 5120 1440
}

# Jetbrains
windowrule = match:class jetbrains.*, match:title win.*, no_focus true # Prevents tooltips from stealing focus

# Material Maker
windowrule = match:class Material Maker, match:initial_title Godot, tile true
windowrule = match:class Material Maker, match:title Alert!, float true

# Dunst
layerrule = match:namespace notifications, blur true
layerrule = match:namespace notifications, ignore_alpha 0
layerrule = match:namespace notifications, animation slide

# Hyprlauncher
layerrule = match:namespace hyprlauncher, blur true
layerrule = match:namespace hyprlauncher, ignore_alpha 0
layerrule = match:namespace hyprlauncher, animation slide

# Rofi
layerrule = match:namespace rofi, blur true
layerrule = match:namespace rofi, ignore_alpha 0
layerrule = match:namespace rofi, animation slide

# SwayNC
layerrule = match:namespace swaync-control-center, blur true
layerrule = match:namespace swaync-control-center, ignore_alpha 0
layerrule = match:namespace swaync-control-window, blur true

# Transitioner
layerrule = match:namespace Transitioner, no_anim true

# Slurp(fixes screenshots being white)
layerrule = match:namespace selection, no_anim true

# Hints
layerrule = match:namespace hints, no_anim true

# XWaylandVideoBridge
windowrule {
    name = XWaylandVideoBridge
    match:class = xwaylandvideobridge

    no_initial_focus = true
    no_focus = true
    no_anim = true
    no_blur = true
    max_size = 1 1
    opacity = 0.0
}

