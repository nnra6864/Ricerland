decoration {
    rounding = $rounding
    inactive_opacity = $inactiveOpacity
    blur {
        size = 10
		passes = 3
		ignore_opacity = true
		noise = 0.02
		contrast = 1
		vibrancy = 1
		popups = true
		new_optimizations = false #Fixes hyprwinwrap not being visible behind tiled windows
    }

	shadow {
		enabled = true
		range = 10
		render_power = 2
		color = $shadowCol
		color_inactive = $shadowInactiveCol
	}
}

