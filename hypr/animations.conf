animations {
    enabled = true
	workspace_wraparound = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = linear, 0.0, 0.0, 1.0, 1.0
    bezier = quad, 0.45, 0, 0.55, 1
    bezier = quadOut, 0.5, 1, 0.89, 1
    bezier = expo, 0.87, 0, 0.13, 1
    bezier = expoIn, 0.7, 0, 0.84, 0
    bezier = expoOut, 0.16, 1, 0.3, 1
	bezier = overshoot, 0.25, 1.75, 0, 0.9

	animation = fade, 1, $animationDuration, expoOut

    animation = windows, 1, $animationDuration, $animationCurve, slide
    animation = windowsOut, 1, $animationDuration, $animationCurve, slide
    animation = windowsMove, 1, $animationDuration, $animationCurve

	animation = layersIn, 1, $animationDuration, $animationCurve, fade
    animation = layersOut, 1, $animationDuration, $animationCurve, fade

    animation = border, 1, $animationDuration, quadOut
    animation = borderangle, 1, 30, linear, loop

    animation = workspaces, 1, $animationDuration, $animationCurve, slide
    animation = specialWorkspace, 1, $animationDuration, $animationCurve, slidefadevert
}
