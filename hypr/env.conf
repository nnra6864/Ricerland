# Hyprland
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Terminal
env = TERMINAL, $terminal

# Cursor
env = XCURSOR_THEME, $cursor
env = XCURSOR_SIZE, $cursorSize
env = HYPRCURSOR_THEME, $cursor
env = HYPRCURSOR_SIZE, $cursorSize

# Theming
env = GTK_THEME, $theme
env = GDK_SCALE, 1
env = CLUTTER_BACKEND, wayland
env = $termColors

# QT
env = QT_QPA_PLATFORM, wayland;xcb
env = QT_QPA_PLATFORMTHEME, qt6ct
env = QT_QUICK_CONTROLS_STYLE, org.kde.desktop
env = QT_AUTO_SCREEN_SCALE_FACTOR, 1
env = QT_SCALE_FACTOR, 1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1

# Application Variables
#env = GDK_BACKEND, wayland, x11, *
env = MOZ_ENABLE_WAYLAND, 1
env = MOZ_WAYLAND_USE_VAAPI, 1
env = MOZ_DBUS_REMOTE, 1
env = MOZ_ACCELERATED, 1
env = MOZ_WEBRENDERER, 1
env = MOZ_DISABLE_RDD_SANDBOX, 1
env = _JAVA_AWT_WM_NONREPARENTING, 1
env = ELECTRON_OZONE_PLATFORM_HINT, wayland
env = XAUTHORITY, $HOME/.Xauthority # Required for gparted and some other x11 apps
env = ALSOFT_DRIVERS, pulse # Fixes issues with some apps
env = OLLAMA_MODELS, $HOME/Data/Ollama/models # My directory for ollama models
env = OXR_RECENTER_STAGE, 1 # Makes WiVRn recentering work

# Nvidia
env = LIBVA_DRIVER_NAME, nvidia
env = GBM_BACKEND, nvidia-drm
env = EGL_PLATFORM, wayland
env = WLR_USE_LIBINPUT, 1
env = __GL_VRR_ALLOWED, 0
env = __GL_GSYNC_ALLOWED, 1
env = __GLX_VENDOR_LIBRARY_NAME, nvidia
env = NVD_BACKEND, direct
cursor:no_hardware_cursors = 1 # Improves performance significantly for me, especially with dynamic-cursors

# Accessibility(used for hints)
env = ACCESSIBILITY_ENABLED, 1
env = GTK_MODULES, gail:atk-bridge
env = OOO_FORCE_DESKTOP, gnome
env = GNOME_ACCESSIBILITY, 1
env = QT_ACCESSIBILITY, 1
env = QT_LINUX_ACCESSIBILITY_ALWAYS_ON, 1
