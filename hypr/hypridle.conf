# Lock KeePassXC
listener {
    timeout = 300
    on-timeout = qdbus6 org.keepassxc.KeePassXC.MainWindow /keepassxc org.keepassxc.KeePassXC.MainWindow.lockAllDatabases && notify-send "KeePassXC locked due to inactivity" && paplay /usr/share/sounds/freedesktop/stereo/message.oga && hyprlock
}

# Display off/on
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on && brightnessctl -r
}
