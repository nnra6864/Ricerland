plugin {
	hyprtasking {
		layout = grid

		gap_size = 10
		bg_color = 0x$bgCol
		border_size = $borderSize
		exit_behavior = hovered

		gestures {
			enabled = true
			open_fingers = 3
			open_distance = 300
			open_positive = true
		}

		grid {
			rows = 3
			cols = 3
		}

		linear {
			height = 400
			scroll_speed = 1.1
			blur = 0
		}
	}
}
