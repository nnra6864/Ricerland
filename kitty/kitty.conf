# BEGIN_KITTY_FONTS
font_family		 family="Courier Prime Code"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

font_size 17
editor nvim
disable_ligatures never

cursor #B2B2B2
cursor_text_color #080808
cursor_shape block
mouse_hide_wait 0
cursor_trail 1
cursor_trail_start_threshold 0
shell_integration no-cursor

url_color #0094B2
url_style straight
open_url_with default

window_padding_width 10
confirm_os_window_close 0

foreground #B2B2B2
background #080808
background_opacity 1

selection_foreground #CBCBCB
selection_background #212121

# Black
color0 #080808
color8 #212121
# Red
color1 #990000
color9 #B20000
# Green
color2 #00990D
color10 #00B20E
# Yellow
color3 #998000
color11 #B29400
# Blue
color4 #006699
color12 #0077B2
# Magenta
color5 #990099
color13 #B200B2
# Cyan
color6 #008099
color14 #0094B2
# White
color7 #999999
color15 #B2B2B2
