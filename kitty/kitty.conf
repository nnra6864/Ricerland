# BEGIN_KITTY_FONTS
font_family		 family="Courier Prime Code"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

font_size 17
editor nvim
disable_ligatures never

cursor #ACCAE6
cursor_text_color #102840
cursor_shape block
mouse_hide_wait 0
cursor_trail 1
cursor_trail_start_threshold 0
shell_integration no-cursor

url_color #72ACE5
url_style straight
open_url_with default

window_padding_width 10
confirm_os_window_close 0

foreground #ACCAE6
background #102840
background_opacity 1

selection_foreground #BDDFFF
selection_background #153959

# Black
color0 #102840
color8 #153959
# Red
color1 #13304D
color9 #174066
# Green
color2 #1A4066
color10 #1F4F7F
# Yellow
color3 #205080
color11 #275E99
# Blue
color4 #266099
color12 #2C71B2
# Magenta
color5 #2D70B3
color13 #3480CB
# Cyan
color6 #6699CC
color14 #72ACE5
# White
color7 #ACCAE6
color15 #BDDFFF
