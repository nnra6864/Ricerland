[mgr]
ratio = [2, 4, 4]

sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
sort_translit  = true

linemode     = "mtime"
show_hidden  = false
show_symlink = true

[preview]
wrap     = "yes"
tab_size = 4

max_width     = 2048
max_height    = 2048
image_delay   = 0
image_filter  = "triangle"
image_quality = 50

[opener]
play = [
    { run = "mpv %s",                        orphan = true, for = "unix" },
    { run = '"C:\Program Files\mpv.exe" %s', orphan = true, for = "windows" }
]
edit = [
    { run = "$EDITOR %s",  block = true, for = "unix" },
    { run = "%EDITOR% %s", block = true, for = "windows" },
]
open = [
    { run = "xdg-open %s", desc = "Open" },
]

[open]
prepend_rules = [
    { mime = "text/*",  use = "edit" },
    { mime = "image/*", use = "play" },
    { mime = "video/*", use = "play" },
    { mime = "audio/*", use = "play" },
]

[plugin]
prepend_fetchers = [
    { group = "git", url = "*",  run = "git" },
    { group = "git", url = "*/", run = "git" }
]

prepend_previewers = [
    { mime = "audio/*",             run = "exifaudio" },
    { url = "*.blend",              run = "blender-preview" },
    { url = "*.blend1",             run = "blender-preview" },
    { url = "*.kra",                run = "krita-preview" },
    { url = "*.kra~",               run = "krita-preview" },
    { url = "*.tar*",               run = 'piper --format=url -- tar tf "$1"' },
    { url = "*.csv",                run = 'piper -- bat -p --color=always "$1"' },
    { url = "*.md",                 run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"' },
    { url = "*/",                   run = 'piper -- zl -r -L=3 --dir-grouping=before --root-display=none "$1"' },
    { mime = "application/sqlite3", run = 'piper -- sqlite3 "$1" ".schema --indent"' }
]

prepend_preloaders = [
    { url = "*.blend",  run = "blender-preview" },
    { url = "*.blend1", run = "blender-preview" },
    { url = "*.kra",    run = "krita-preview" },
    { url = "*.kra~",   run = "krita-preview" }
]
