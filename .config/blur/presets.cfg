[blur v2.42]
* = default preset, cannot be modified

- nvidia
*h264: -c:v h264_nvenc -preset p5 -rc vbr -cq {quality}
*h265: -c:v hevc_nvenc -preset p5 -rc vbr -cq {quality}
*av1: -c:v av1_nvenc -preset p5 -rc vbr -cq {quality}

- amd
*h264: -c:v h264_amf -rc cqp -qp_i {quality} -qp_p {quality} -qp_b {quality}
*h265: -c:v hevc_amf -rc cqp -qp_i {quality} -qp_p {quality} -qp_b {quality}
*av1: -c:v av1_amf -rc cqp -qp_i {quality} -qp_p {quality} -qp_b {quality}

- intel
*h264: -c:v h264_qsv -global_quality {quality} -preset veryfast
*h265: -c:v hevc_qsv -global_quality {quality} -preset veryfast
*av1: -c:v av1_qsv -global_quality {quality} -preset veryfast

- mac
*h264: -c:v h264_videotoolbox -q:v {quality}
*h265: -c:v hevc_videotoolbox -q:v {quality}
*av1: -c:v av1_videotoolbox -q:v {quality}
*prores: -c:v prores_videotoolbox -profile:v {quality}

- cpu
*h264: -c:v libx264 -preset veryfast -crf {quality}
*h265: -c:v libx265 -preset veryfast -crf {quality}
*av1: -c:v libaom-av1 -cpu-used 4 -crf {quality}
*vp9: -c:v libvpx-vp9 -deadline good -crf {quality} -b:v 0
